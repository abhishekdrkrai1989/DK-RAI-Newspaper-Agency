name: newspaper_delivery_app
description: Offline-first mobile application for newspaper delivery boys to manage distribution lists, started/paused papers, daily/weekend variants, and monthly society-wise billing on local mobile storage.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
